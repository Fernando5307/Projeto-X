<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Experience 2026</title>
<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>
</head>
<body>
 <main class="container">
 <section class="card">
 <h1 class="H11">Tech Experience 2026</h1>
 <p class="H11">
 Preencha os seus dados para realizar sua inscrição.
 </p>
 <label for="nome">Nome:</label>
 <input
 type="text"
 id="nome"
 placeholder="Digite seu nome"
 >
 <label for="email">Email:</label>
 <input type="email" placeholder="Digite seu email">
 <label for="telefone">Telefone:</label>
 <input type="number" placeholder="Digite seutelefone">
 <label for="idade">Idade:</label>
 <input
 type="number"
 id="idade"
 placeholder="Digite sua idade"
 >
<button id="inscrever">
 Realizar inscrição
 </button>
 <p id="mensagem"></p>
 </section>
 </main> 
</body>
</html>
